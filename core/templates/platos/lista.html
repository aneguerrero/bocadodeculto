{% extends 'base.html' %}
{% load static i18n %}

{% block otros_css %}
<link rel="stylesheet" href="{% static 'css/platos.css' %}">
<link rel="stylesheet" href="{% static 'css/pelis.css' %}">
{% endblock %}

{% block contenido %}

<div class="recetario-encabezado">
    <div>
        <h1>
            <span>{% translate "Nuestro" %}</span>
            <img src="{% static 'images/recetario.png' %}"
                 alt=""
                 class="icono-recetario">
            <span>{% translate "recetario" %}</span>
        </h1>
    </div>
    <p>{% translate "Conoce los platos de la gran pantalla" %}</p>
</div>

<form id="buscar" role="search" method="get" action="{% url 'lista_platos' %}">
    <label for="q">{% translate "Buscar plato" %}</label>
    <div class="buscar-controles">
        <input id="q" name="q" type="search" value="{{ q }}" placeholder="{% translate 'Escribe un nombre…' %}">
        <button type="submit">{% translate "Buscar" %}</button>
        <a id="limpiar" href="{% url 'lista_platos' %}">{% translate "Limpiar" %}</a>
    </div>
</form>

<div class="recetario-estanteria" id="recetario">
    <div class="platos-estanteria" id="resultados" aria-live="polite">
        {% include "platos/_tarjetas.html" %}
    </div>
</div>

<script defer src="{% static 'js/buscador-platos.js' %}"></script>

{% endblock %}
